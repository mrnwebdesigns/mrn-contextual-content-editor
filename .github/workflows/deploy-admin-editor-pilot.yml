name: Deploy admin-editor pilot

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to release to admin-editor-pilot.mrndev.io
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: admin-editor-pilot-dev
  cancel-in-progress: false

jobs:
  request-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit release reference
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release is reachable from main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Build immutable artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output=artifact.tar.gz HEAD
          sha256sum artifact.tar.gz | cut -d' ' -f1 > artifact.sha256

      - name: Obtain temporary artifact-upload credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.MRN_DEPLOY_ARTIFACT_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload artifact
        id: artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          key="deployment-artifacts/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          aws s3api put-object \
            --bucket mrn-webdesigns-backups \
            --key "$key" \
            --body artifact.tar.gz \
            --server-side-encryption AES256 \
            --checksum-algorithm SHA256 \
            --if-none-match '*'
          printf 'uri=s3://mrn-webdesigns-backups/%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(cat artifact.sha256)" >> "$GITHUB_OUTPUT"

      - name: Request pilot deployment
        env:
          ARTIFACT_URI: ${{ steps.artifact.outputs.uri }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fdeploy.mrndev.io")"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          jq -n \
            --arg target admin-editor-pilot-dev \
            --arg uri "$ARTIFACT_URI" \
            --arg sha256 "$ARTIFACT_SHA256" \
            --arg key "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}" \
            '{target:$target, artifact:{uri:$uri, sha256:$sha256}, idempotencyKey:$key}' \
          | curl --fail --silent --show-error \
              --header "Authorization: Bearer ${oidc_token}" \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              https://deploy.mrndev.io/v1/deployments
